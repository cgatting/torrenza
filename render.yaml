services:
  - type: web
    name: torrenza
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TORRENZA_DATA_DIR
        value: /var/data
      - key: TORRENZA_DOWNLOAD_DIR
        value: /var/data/downloads
      - key: TORRENZA_PYTHON
        value: python3
